name: Fly Deploy
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: Production
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check deployment credentials
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: test -n "$FLY_API_TOKEN" || { echo 'Configure FLY_API_TOKEN in the production environment'; exit 1; }
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Migrations must be approved and applied via the release runbook before promoting the API.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
